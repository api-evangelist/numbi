name: Numbi
description: 'Numbi is a tech-enabled accounting and payroll firm for Colombian companies
  — especially SAS entities, SMBs, and startups. It pairs expert accountants with automation
  and AI to run monthly bookkeeping, taxes, payroll, and DIAN electronic-invoicing compliance.
  Numbi is a service rather than software or an ERP: it operates on top of a company''s
  existing accounting systems (Siigo and Alegra) instead of replacing them, ingesting
  documents (PDFs, XMLs, images) and keeping tax calendars and filings current. Founded
  in Bogotá and backed by Homebrew and Newtopia VC. No public developer API surface is
  published as of this pass.'
